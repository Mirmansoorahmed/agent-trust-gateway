<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 14px; fill: #102a43; }
    .h { font-weight: 700; }
  </style>
  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="40" y="36" class="h" style="font-size:18px">Approval after untrusted content</text>
  <text x="80" y="80" text-anchor="middle" class="h">Agent</text>
  <text x="300" y="80" text-anchor="middle" class="h">Gateway</text>
  <text x="540" y="80" text-anchor="middle" class="h">Human</text>
  <text x="820" y="80" text-anchor="middle" class="h">Mail server</text>
  <line x1="80" y1="96" x2="80" y2="530" stroke="#9fb3c8"/>
  <line x1="300" y1="96" x2="300" y2="530" stroke="#9fb3c8"/>
  <line x1="540" y1="96" x2="540" y2="530" stroke="#9fb3c8"/>
  <line x1="820" y1="96" x2="820" y2="530" stroke="#9fb3c8"/>
  <text x="100" y="140">fetch untrusted page</text>
  <line x1="80" y1="150" x2="300" y2="150" stroke="#102a43"/>
  <text x="320" y="190">allow, mark saw_untrusted</text>
  <line x1="300" y1="200" x2="80" y2="200" stroke="#102a43"/>
  <text x="100" y="250">send mail to a colleague</text>
  <line x1="80" y1="260" x2="300" y2="260" stroke="#102a43"/>
  <text x="320" y="300">needs_approval, no upstream call</text>
  <line x1="300" y1="310" x2="80" y2="310" stroke="#8a5a00"/>
  <text x="320" y="360">approve this exact call</text>
  <line x1="540" y1="370" x2="300" y2="370" stroke="#0b6e4f"/>
  <text x="100" y="420">same send again</text>
  <line x1="80" y1="430" x2="300" y2="430" stroke="#102a43"/>
  <text x="320" y="470">downstream token, then send</text>
  <line x1="300" y1="480" x2="820" y2="480" stroke="#102a43"/>
  <text x="100" y="520">allow</text>
  <line x1="300" y1="510" x2="80" y2="510" stroke="#102a43"/>
</svg>
