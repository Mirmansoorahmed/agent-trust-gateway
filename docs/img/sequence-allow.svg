<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 14px; fill: #102a43; }
    .h { font-weight: 700; }
  </style>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="40" y="36" class="h" style="font-size:18px">Allowed call</text>
  <text x="90" y="80" text-anchor="middle" class="h">Agent</text>
  <text x="330" y="80" text-anchor="middle" class="h">Gateway</text>
  <text x="560" y="80" text-anchor="middle" class="h">OPA</text>
  <text x="820" y="80" text-anchor="middle" class="h">Mail server</text>
  <line x1="90" y1="96" x2="90" y2="490" stroke="#9fb3c8"/>
  <line x1="330" y1="96" x2="330" y2="490" stroke="#9fb3c8"/>
  <line x1="560" y1="96" x2="560" y2="490" stroke="#9fb3c8"/>
  <line x1="820" y1="96" x2="820" y2="490" stroke="#9fb3c8"/>
  <text x="110" y="140">tools/call + agent token</text>
  <line x1="90" y1="150" x2="330" y2="150" stroke="#102a43"/>
  <text x="350" y="190">validate iss, aud, exp, scope</text>
  <text x="350" y="230">tools/list with downstream token</text>
  <line x1="330" y1="240" x2="820" y2="240" stroke="#102a43"/>
  <text x="350" y="280">catalogue matches the pin</text>
  <line x1="820" y1="290" x2="330" y2="290" stroke="#102a43"/>
  <text x="350" y="330">policy input</text>
  <line x1="330" y1="340" x2="560" y2="340" stroke="#102a43"/>
  <text x="350" y="370">allow</text>
  <line x1="560" y1="380" x2="330" y2="380" stroke="#102a43"/>
  <text x="350" y="420">tools/call, new downstream token</text>
  <line x1="330" y1="430" x2="820" y2="430" stroke="#102a43"/>
  <text x="110" y="470">allow + trace</text>
  <line x1="330" y1="460" x2="90" y2="460" stroke="#102a43"/>
</svg>
