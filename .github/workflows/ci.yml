name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OPA 1.9.0
        run: |
          curl -fsSL -o /tmp/opa https://github.com/open-policy-agent/opa/releases/download/v1.9.0/opa_linux_amd64_static
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check gateway servers agents eval tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Policy tests
        run: opa test policies/
      - name: Eval smoke
        run: python -m eval.runner --reps 1 --smoke

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - name: Validate Entra module
        working-directory: infra/terraform/entra
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate AWS module
        working-directory: infra/terraform/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate
